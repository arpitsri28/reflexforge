[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexforge"
version = "0.1.0"
description = "Reproducible experiments in configuration-driven coding agents"
requires-python = ">=3.11"
dependencies = ["openai>=2.54,<3", "docker>=7,<8", "pydantic>=2.8,<3", "typer>=0.12,<1", "PyYAML>=6,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
analysis = ["matplotlib>=3.8,<4"]

[project.scripts]
reflexforge = "reflexforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon and built sandbox image"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
